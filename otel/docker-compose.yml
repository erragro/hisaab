# Local observability stack for Hisaab.
#   cd otel && docker compose up -d      (or: make otel-up)
#
#   Jaeger  (traces)      http://localhost:16686
#   Grafana (metrics)     http://localhost:3001     (anonymous admin; GRAFANA_PORT to change)
#   Prometheus            http://localhost:9090
#
# Point the app at it:  HISAAB_OTEL=1  OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318
name: hisaab-otel

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.103.1
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./collector-config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4318:4318"   # OTLP HTTP  (the app -> here)
      - "4317:4317"   # OTLP gRPC
      - "8889:8889"   # Prometheus scrape endpoint (collector -> Prometheus)
    depends_on: [jaeger]

  jaeger:
    image: jaegertracing/all-in-one:1.57
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"

  prometheus:
    image: prom/prometheus:v2.53.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2h
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_SECURITY_ADMIN_PASSWORD: hisaab
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on: [prometheus, jaeger]
